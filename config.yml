# treesOutsideForests configuration.
# Every path is relative to the repository root and is resolved with
# here::here() through shared/R/setup.R, so scripts run from any working
# directory inside the repo. Open treesOutsideForests.Rproj to guarantee that.

crs: "EPSG:5070"   # analysis CRS: CONUS Albers Equal Area

reference:
  lrr_gpkg:  "data/reference/lower48LRR.gpkg"
  mlra_gpkg: "data/reference/lower48MLRA.gpkg"
  grid_gpkg: "data/reference/grid100km_aea.gpkg"

# ---------------------------------------------------------------- masks/ ----
masks:
  llr_id: "F"
  years: {start: 2009, end: 2021}
  nlcd_classes: [41, 42, 43]            # NLCD forest classes
  # FALSE: a year with no Census Places release of its own gets no urban
  # product. TRUE restores the nearest-year fallback (see masks/README.md).
  allow_census_year_substitution: false
  # TRUE re-queries the Census API for years previously marked .unavailable.
  census_recheck_unavailable: false
  # Metres added around the LRR bounding box when clipping national NLCD.
  study_area_margin_m: 5000
  paths:
    nlcd_raw:       "data/masks/raw/NLCD"
    nlcd_processed: "data/masks/processed/NLCD"
    census_raw:     "data/masks/raw/census"
    outputs:        "data/masks/outputs/llr_masks"

# ----------------------------------------------------------------- naip/ ----
naip:
  target_region: "both"                 # "F", "G", or "both"
  target_years: ["2012", "2016", "2020"]
  buffer_dist_m: 250                    # 250 m around the 1 km grid = 1.5 km window
  run_snic: false
  export_1km_tight: false
  workers: 8
  paths:
    sample_f_csv: "data/reference/sampleGrids/selectedSample_lrr_F_05_2026.csv"
    sample_g_csv: "data/reference/sampleGrids/selectedSample_lrr_G_draw_1400_05_2026.csv"
    export_dir:   "data/naip/exportData"

# ------------------------------------------------------------- sampling/ ----
sampling:
  llr_id: "F"
  seed: 125                 # same seed the naip tests use, for reproducible draws
  # Ground-truth sites inside the LRR are split at random into two roles.
  # n_training is taken first; validation gets what remains, capped at n_validation.
  n_training: 120
  n_validation: 70
  interactive_grid_min_zoom: 9    # zoom level at which the sampled 1 km cell outlines appear on the web map
  context_year: 2020              # year of the Census places and NLCD forest context layers
  # Block size (in 30 m pixels) used to coarsen the NLCD forest mask for the web maps:
  forest_block_lrr: 16            # 480 m for the whole-LRR map
  forest_block_mlra: 8            # 240 m for the per-MLRA maps
  mlra_margin_m: 20000            # map margin around each MLRA
  paths:
    sample_csv:      "data/reference/sampleGrids/selectedSample_lrr_F_05_2026.csv"
    groundtruth_csv: "data/reference/sampleGrids/groundTruth_ids_lrr_F_06_2026.csv"
    roles_csv:       "data/reference/sampleGrids/siteRoles_lrr_F_09_2026.csv"
    map_dir:         "data/sampling/maps"
    derived_dir:     "data/sampling/derived"      # cached, coarsened context layers
    masks_outputs:   "data/masks/outputs/llr_masks" # products of the masks/ stage
  # Systematic sample grid (00_draw_sample_grid.R): about n_per_mlra 1 km cells
  # per MLRA, one seeded regular-lattice draw per MLRA. These values reproduce
  # the May 2026 reference lists byte-for-byte; sampling/test/ checks that.
  grid:
    lrr_ids: ["F", "G"]
    n_per_mlra: 1400
    seed: 1234
    out_dir: "data/sampling/sampleGrids"
    # Boundary-marginal 1 km cells and whether the March 2026 grid (the frame
    # of the reference draws) contained them; pins the frame across PROJ/GEOS versions.
    frame_corrections: "data/reference/sampleGrids/sampleFrame_marginalCells_03_2026.csv"
    reference:                        # tracked draws the replication test compares against
      F: "data/reference/sampleGrids/selectedSample_lrr_F_05_2026.csv"
      G: "data/reference/sampleGrids/selectedSample_lrr_G_draw_1400_05_2026.csv"

# ------------------------------------------------------------ estimates/ ----
estimates:
  llr_id: "F"
  target_years: ["2012", "2016", "2020"]   # naip target years to summarise
  # Model output per cell and actual NAIP year: a raster over the 1 km cell with
  # 1 = trees outside forest, 0 = not, NA = masked out (Census place / NLCD
  # forest). {id} and {year} in the pattern are the cell id and the actual year.
  model_pattern: "tof_{id}_{year}.tif"
  # Denominator the estimators take as "eligible" (raster mode only): "mask"
  # measures it from the masks/ products; "model" takes the non-NA area of the
  # model raster. In table mode the table's eligible_px is always the denominator.
  eligible_from: "mask"
  # Where the per-cell model output comes from:
  #   "raster": one raster per cell and actual NAIP year (model_pattern, paths$model_dir)
  #   "table":  one CSV of pixel counts per cell and target year (paths$model_table);
  #             the layout is documented in estimates/functions/model_output.R.
  # Set to "table" with the synthetic file while no model output exists.
  model_source: "table"
  pixel_area_m2: 1            # every grid is predicted at 1 m, so a pixel count is an area in m²
  # Synthetic model output (estimates/tools/make_synthetic_cells.R): one seeded
  # draw per MLRA with its own TOF level, most cells at zero, little change over
  # the years, masks near 3 % forest and under 1 % urban.
  synthetic:
    seed: 3      # seed 2026 drew MLRA 59 four standard errors low; the recovery test wants 3
    out_dir: "data/estimates/synthetic"
  paths:
    sample_csv:      "data/reference/sampleGrids/selectedSample_lrr_F_05_2026.csv"
    masks_outputs:   "data/masks/outputs/llr_masks"
    naip_export_dir: "data/naip/exportData"
    model_dir:       "data/tof/predictions"
    model_table:     "data/estimates/synthetic/synthetic_cells_lrr_F.csv"
    out_dir:         "data/estimates"
