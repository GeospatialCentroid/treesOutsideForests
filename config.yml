# treesOutsideForests configuration.
# Every path is relative to the repository root and is resolved with
# here::here() through shared/R/setup.R, so scripts run from any working
# directory inside the repo. Open treesOutsideForests.Rproj to guarantee that.

crs: "EPSG:5070"   # analysis CRS: CONUS Albers Equal Area

reference:
  lrr_gpkg:  "data/reference/lower48LRR.gpkg"
  mlra_gpkg: "data/reference/lower48MLRA.gpkg"
  grid_gpkg: "data/reference/grid100km_aea.gpkg"

# ---------------------------------------------------------------- masks/ ----
masks:
  llr_id: "F"
  years: {start: 2009, end: 2021}
  nlcd_classes: [41, 42, 43]            # NLCD forest classes
  # FALSE: a year with no Census Places release of its own gets no urban
  # product. TRUE restores the nearest-year fallback (see masks/README.md).
  allow_census_year_substitution: false
  # TRUE re-queries the Census API for years previously marked .unavailable.
  census_recheck_unavailable: false
  # Metres added around the LRR bounding box when clipping national NLCD.
  study_area_margin_m: 5000
  paths:
    nlcd_raw:       "data/masks/raw/NLCD"
    nlcd_processed: "data/masks/processed/NLCD"
    census_raw:     "data/masks/raw/census"
    outputs:        "data/masks/outputs/llr_masks"

# ----------------------------------------------------------------- naip/ ----
naip:
  target_region: "both"                 # "F", "G", or "both"
  target_years: ["2012", "2016", "2020"]
  buffer_dist_m: 250                    # 250 m around the 1 km grid = 1.5 km window
  run_snic: false
  export_1km_tight: false
  workers: 8
  paths:
    sample_f_csv: "data/reference/sampleGrids/selectedSample_lrr_F_05_2026.csv"
    sample_g_csv: "data/reference/sampleGrids/selectedSample_lrr_G_draw_1400_05_2026.csv"
    export_dir:   "data/naip/exportData"

# ------------------------------------------------------------- sampling/ ----
sampling:
  llr_id: "F"
  seed: 125                 # same seed the naip tests use, for reproducible draws
  # Site roles come from the partner's train / validation / test partitions:
  # one CSV per candidate partition, one row per scene (scene_id = 1 km cell
  # id, Type = Train / Validation / Test). Every entry gets its own map set,
  # its own site pages and its own roles CSV (paths$roles_csv with {partition}
  # replaced by the key). Remove an entry to drop it from the maps and the site.
  partitions:
    test34: {csv: "data/reference/sampleGrids/testSetPartition_34_lrr_F_09_2026.csv", label: "34 test sites"}
    test44: {csv: "data/reference/sampleGrids/testSetPartition_44_lrr_F_09_2026.csv", label: "44 test sites"}
  # Fallback when `partitions` is empty: the ground-truth sites are split at
  # random (seed above) into n_training training and up to n_validation
  # validation sites, and the roles CSV is written once and then reused.
  n_training: 120
  n_validation: 70
  interactive_grid_min_zoom: 9    # zoom level at which the sampled 1 km cell outlines appear on the web map
  context_year: 2020              # year of the Census places and NLCD forest context layers
  # Block size (in 30 m pixels) used to coarsen the NLCD forest mask for the web maps:
  forest_block_lrr: 16            # 480 m for the whole-LRR map
  forest_block_mlra: 8            # 240 m for the per-MLRA maps
  mlra_margin_m: 20000            # map margin around each MLRA
  paths:
    sample_csv:      "data/reference/sampleGrids/selectedSample_lrr_F_05_2026.csv"
    groundtruth_csv: "data/reference/sampleGrids/groundTruth_ids_lrr_F_06_2026.csv"
    roles_csv:       "data/reference/sampleGrids/siteRoles_lrr_F_{partition}_09_2026.csv"  # {partition} = a key of `partitions`
    map_dir:         "data/sampling/maps"
    derived_dir:     "data/sampling/derived"      # cached, coarsened context layers
    masks_outputs:   "data/masks/outputs/llr_masks" # products of the masks/ stage
  # Systematic sample grid (00_draw_sample_grid.R): about n_per_mlra 1 km cells
  # per MLRA, one seeded regular-lattice draw per MLRA. These values reproduce
  # the May 2026 reference lists byte-for-byte; sampling/test/ checks that.
  grid:
    lrr_ids: ["F", "G"]
    n_per_mlra: 1400
    seed: 1234
    out_dir: "data/sampling/sampleGrids"
    # Boundary-marginal 1 km cells and whether the March 2026 grid (the frame
    # of the reference draws) contained them; pins the frame across PROJ/GEOS versions.
    frame_corrections: "data/reference/sampleGrids/sampleFrame_marginalCells_03_2026.csv"
    reference:                        # tracked draws the replication test compares against
      F: "data/reference/sampleGrids/selectedSample_lrr_F_05_2026.csv"
      G: "data/reference/sampleGrids/selectedSample_lrr_G_draw_1400_05_2026.csv"

# ------------------------------------------------------------ estimates/ ----
estimates:
  llr_id: "F"
  target_years: ["2012", "2016", "2020"]   # naip target years to summarise
  # Model output per cell and actual NAIP year: a raster over the 1 km cell with
  # 1 = trees outside forest, 0 = not, NA = masked out (Census place / NLCD
  # forest). {id} and {year} in the pattern are the cell id and the actual year.
  model_pattern: "tof_{id}_{year}.tif"
  # Denominator the estimators take as "eligible" (raster mode only): "mask"
  # measures it from the masks/ products; "model" takes the non-NA area of the
  # model raster. In table mode the table's eligible_px is always the denominator.
  eligible_from: "mask"
  # Where the per-cell model output comes from:
  #   "raster": one raster per cell and actual NAIP year (model_pattern, paths$model_dir)
  #   "table":  one CSV of pixel counts per cell and target year (paths$model_table);
  #             the layout is documented in estimates/functions/model_output.R.
  # Set to "table" with the synthetic file while no model output exists.
  model_source: "table"
  pixel_area_m2: 1            # every grid is predicted at 1 m, so a pixel count is an area in m²
  # Synthetic model output (estimates/tools/make_synthetic_cells.R): one seeded
  # draw per MLRA with its own TOF level, most cells at zero, little change over
  # the years, masks near 3 % forest and under 1 % urban.
  synthetic:
    seed: 3      # seed 2026 drew MLRA 59 four standard errors low; the recovery test wants 3
    out_dir: "data/estimates/synthetic"
  # Placeholder TOF per clipped AOI for partners (estimates/02_placeholder_tof.R):
  # calibrated so every MLRA-year's area-weighted TOF share equals the MLRA's
  # NLCD forest share; zero-inflated with a long right tail across AOIs.
  placeholder:
    seed: 7
    p_zero: 0.65     # share of AOIs with no TOF in any year
    sdlog: 1.0       # lognormal spread of the rest (larger = longer tail)
    cap: 0.5         # no AOI above this share of its eligible land
    out_dir: "data/estimates/placeholder"
  # Monte Carlo replicates of the placeholder (estimates/03_montecarlo_replicates.R):
  # n_rep clipped-normal draws per AOI for one year, as a Parquet dataset.
  montecarlo:
    year: 2020
    n_rep: 50000
    seed: 11
    bias_rel: 0.20        # the model over-predicts: mean = tof * (1 + bias_rel) + fp_frac * eligible
    fp_frac: 0.001        # false-positive floor, share of eligible land, applied to every AOI
    cv: 0.30              # spread growing with TOF: sd = sqrt((cv * tof)^2 + (sd_floor_frac * eligible)^2)
    sd_floor_frac: 0.0015 # spread floor, share of eligible land (tight where there are no trees)
    out_dir: "data/estimates/placeholder/montecarlo_lrr_F_2020"
  # Area-weighted estimates for every replicate (estimates/04_replicate_estimates.R):
  # reads the montecarlo dataset; year and n_rep come from the block above.
  replicates:
    out_dir: "data/estimates/replicates"
    # Optional: also run the partner's wide CSV for one MLRA and check it against
    # the Parquet result; NULL skips it.
    wide_csv_check: "data/estimates/placeholder/montecarlo_lrr_F_2020/montecarlo_wide_lrr_F_2020_mlra_54.csv"
  paths:
    sample_csv:      "data/reference/sampleGrids/selectedSample_lrr_F_05_2026.csv"
    masks_outputs:   "data/masks/outputs/llr_masks"
    aoi_areas_csv:   "data/estimates/aoiAreas_lrr_F.csv"          # 01_aoi_areas.R output
    aoi_gpkg:        "data/estimates/aoi_lrr_F_clipped.gpkg"      # the clipped AOIs, one layer per year
    naip_export_dir: "data/naip/exportData"
    model_dir:       "data/tof/predictions"
    model_table:     "data/estimates/synthetic/synthetic_cells_lrr_F.csv"
    out_dir:         "data/estimates"

# ------------------------------------------------------------ harmonize/ ----
# Optional radiometric harmonisation of the NAIP exports across years
# (harmonize/0_run.R). Builds data/naip/harmonized/ with the same layout as
# the export tree; point the model's prediction at it with --harmonized.
harmonize:
  mode: "consensus"          # consensus: remap only a KS-flagged outlier year; reference: remap every year to reference_year
  reference_year: "latest"   # reference mode only: "latest" or a year such as 2020
  eval_bands: ["blue", "nir"]  # bands the KS drift test looks at (all four bands are remapped)
  ks_threshold: 0.15         # a candidate outlier must be at least this far from the consensus pair ...
  ks_relative: 2.0           # ... and this many times further than the pair is from each other
  ks_sample: 10000           # regular sample per raster for the KS tests
  n_quantiles: 256           # quantile matching resolution (8-bit range)
  workers: 6
  overwrite: false           # true redoes cells that already have harmonization.json
  cells: null                # optional list of cell ids; null = every cell in the export tree
  paths:
    export_dir: "data/naip/exportData"
    out_dir:    "data/naip/harmonized"

# ---------------------------------------------------------------- model/ ----
# U-Net tree / no-tree model trained on the reference masks (see model/README.md).
model:
  llr_id: "F"
  # Folders of reference masks, <id>_<year>_mask.tif, 1 m binary, NoData 255.
  paths:
    mask_dirs:
      - "agroforestry_trainingValidation/lrr_F/masks_train"
      - "agroforestry_trainingValidation/lrr_F/masks_validation"
    naip_export_dir: "data/naip/exportData"         # the naip stage's per-cell exports
    work_dir:        "data/model"                    # manifest, aligned pairs, stats
    runs_dir:        "data/model/runs"               # one folder per training run
  fetch_workers: 6                                   # parallel NAIP downloads (00_fetch_naip.R)
  # Which train / validation / test assignment the model follows: a key of
  # sampling$partitions. Scenes absent from it are left out of training.
  partition: "test34"
  # Patch sampling (01_prepare.py / training loader)
  patch_size: 256
  train_stride: 128        # training patches overlap by half
  eval_stride: 256         # validation and test patches tile the scene
  min_tree_fraction: 0.0   # a training patch counts as a tree patch with any tree pixel; sparse trees are the point
  background_ratio: 1.0    # background patches kept per tree patch (balances the sample)
  # Training (02_train.py)
  encoder: "resnet34"      # any segmentation_models_pytorch encoder
  encoder_weights: "imagenet"
  batch_size: 16
  epochs: 40
  min_epochs: 8
  patience: 8              # epochs without validation F1 gain before stopping
  learning_rate: 0.0003
  weight_decay: 0.0001
  threads: 8               # torch intra-op threads (CPU); ubuntu-gpu has 12 cores, leave some for the loader workers and the concurrent service
  device: "auto"           # auto = GPU when CUDA or ROCm is visible, else CPU; or cpu / cuda / cuda:N (ROCm GPUs appear as "cuda" too)
  mixed_precision: true    # bfloat16/float16 autocast on the GPU (ignored on CPU)
  loader_workers: 4
  seed: 2026
  # Memory guard: the trainer refuses to start, and stops between epochs, when
  # system memory available drops below this, so it never competes with the
  # concurrent service for the last gigabytes. The run scripts also wrap the
  # process in a user cgroup with MemoryMax = cgroup_max_gb.
  # ubuntu-gpu has 23 GB of RAM, so the ceiling sits below that; the CPU host
  # that ran the first training used 12 / 40.
  min_available_gb: 8
  cgroup_max_gb: 16
