# Build docs/ with Jekyll and publish it to GitHub Pages.
#
# Repository Settings > Pages > Source must be set to "GitHub Actions" for this
# workflow to be the publisher. With "Deploy from a branch" GitHub decides for
# itself whether to run Jekyll, and it published docs/ as plain static files,
# so the Markdown map pages under docs/_maps/ were never rendered.
name: Publish site

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3   # uploads ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
