<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
<style>
  :root { --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #8a8880; --line: #e3e1da; --bg: #fcfcfb; --card: #ffffff; --accent: #4a3aa7; --accent-2: #e34948; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
  .topbar { border-bottom: 1px solid var(--line); background: var(--card); }
  .topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-top: 12px; padding-bottom: 12px; }
  .brand { font-weight: 700; color: var(--ink); }
  .brand:hover { text-decoration: none; color: var(--accent); }
  .crumbs { color: var(--ink-3); font-size: 0.9rem; }
  .crumbs a { color: var(--ink-2); }
  .crumbs span::before { content: "/"; margin: 0 8px; color: var(--ink-3); }
  main.wrap { padding-top: 28px; }
  h1 { font-size: 1.8rem; line-height: 1.2; margin: 0 0 6px; }
  h2 { font-size: 1.3rem; margin: 32px 0 10px; }
  h3 { font-size: 1.05rem; margin: 24px 0 6px; }
  .prose { max-width: 44em; }
  .prose p, .prose li { color: #2b2a27; }
  .prose img { max-width: 100%; height: auto; }
  .prose code { background: #f3f2ee; padding: 1px 5px; border-radius: 3px; font-size: 0.92em; }
  .prose table { border-collapse: collapse; margin: 12px 0; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  footer { border-top: 1px solid var(--line); margin-top: 48px; padding: 20px 0 40px; color: var(--ink-3); font-size: 0.85rem; }
  footer a { color: var(--ink-2); }
  {% if page.extra_css %}{{ page.extra_css }}{% endif %}
</style>
</head>
<body>
<nav class="topbar">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="crumbs"><a href="{{ '/' | relative_url }}">Home</a>{% if page.crumb %}<span>{{ page.crumb }}</span>{% endif %}</div>
  </div>
</nav>

<main class="wrap">
{{ content }}
</main>

<footer>
  <div class="wrap">
    <a href="{{ '/' | relative_url }}">Back to all maps</a> &middot;
    Source: <a href="{{ site.repo_url }}">GeospatialCentroid/treesOutsideForests</a>.
  </div>
</footer>
</body>
</html>
